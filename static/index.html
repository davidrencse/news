<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medium Library</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo">M</span>
      <div><b>Medium Library</b><small>curated · offline · PDF</small></div>
    </div>
    <nav id="tree" class="tree" aria-label="Topics"></nav>
    <div class="side-foot">
      <div id="indexStatus" class="index-status"></div>
      <button id="newTopicBtn" class="btn ghost wide">+ New topic</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <form id="searchForm" class="searchform" role="search">
        <input id="search" class="input search" type="search" placeholder="Search all of Medium…  (Enter)" autocomplete="off" aria-label="Search all of Medium">
      </form>
      <form id="pasteForm" class="paste">
        <input id="pasteUrl" class="input" placeholder="Paste a Medium article link…" required autocomplete="off">
        <select id="pasteDest" class="input" aria-label="Save to"></select>
        <button type="submit" class="btn primary">Add &amp; read</button>
      </form>
    </header>

    <section class="view">
      <div id="viewHead" class="view-head"></div>
      <div id="list" class="list"></div>
    </section>

    <section id="reader" class="reader" hidden>
      <header class="reader-bar">
        <button id="readerClose" class="btn ghost icon" title="Back to library (Esc)">←</button>
        <div class="reader-title">
          <b id="readerTitle"></b>
          <small id="readerMeta"></small>
        </div>
        <div class="reader-actions">
          <a id="readerOpen" class="btn ghost" target="_blank" rel="noopener">Open PDF ↗</a>
          <a id="readerOriginal" class="btn ghost" target="_blank" rel="noopener noreferrer">Medium ↗</a>
          <button id="readerRefetch" class="btn ghost" title="Download a fresh copy via Freedium">Re-download</button>
        </div>
      </header>
      <div id="readerBody" class="reader-body"></div>
    </section>
  </main>
</div>

<dialog id="dlg" class="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
