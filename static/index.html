<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the layout run under the notch; the CSS pads with safe-area insets -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Library of Babel — Reading desk</title>
  <link rel="icon" type="image/svg+xml" href="/static/babel-mark.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">

  <!-- installable on a phone home screen: browsers read the manifest and product icon -->
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Library of Babel">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f7f7f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171d1a" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/reading-refresh.css">
  <link rel="stylesheet" href="/static/motion.css">
  <!-- article.css (reader) and briefing.css (briefing view) aren't needed for the homepage's first
       paint, so they load without blocking render and apply once fetched. Neither view is shown until
       a click, so they are ready in time; app.py still stamps these hrefs for year-long caching. -->
  <link rel="preload" href="/static/article.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="/static/briefing.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="/static/article.css">
    <link rel="stylesheet" href="/static/briefing.css">
  </noscript>
  <script>
    // applied before paint so a saved theme doesn't flash; app.js owns the toggle
    try { const t = JSON.parse(localStorage.getItem('theme')); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
<div class="app">
  <div id="scrim" class="scrim" hidden></div>
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M7 7.5h18v17H7z"/><path d="M11 12h10M11 16h10M11 20h6"/><circle cx="24" cy="8" r="3"/></svg></span>
      <div><b>Library of Babel</b><small>articles · research · papers</small></div>
      <button id="themeBtn" class="btn ghost icon theme-btn" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">◐</button>
      <button id="babelBtn" class="btn ghost icon babel-btn" aria-label="Library of Babel intro" aria-pressed="false" hidden>⬡</button>
    </div>
    <nav id="tree" class="tree" aria-label="Topics"></nav>
    <div class="side-foot">
      <div id="indexStatus" class="index-status"></div>
      <button id="newTopicBtn" class="btn ghost wide">+ New topic</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="btn ghost icon menu-btn" aria-label="Topics" aria-expanded="false" aria-controls="sidebar">☰</button>
      <form id="searchForm" class="searchform" role="search">
        <input id="search" class="input search" type="search" placeholder="Search your library or Medium   ( / )" autocomplete="off" aria-label="Search your library or Medium">
      </form>
      <button id="pasteBtn" class="btn ghost icon paste-btn" aria-label="Save a link" aria-expanded="false" aria-controls="pasteForm">＋</button>
      <form id="pasteForm" class="paste">
        <input id="pasteUrl" class="input" placeholder="Paste a Medium article link · more sources soon" required autocomplete="off" inputmode="url">
        <select id="pasteDest" class="input" aria-label="Save to"></select>
        <button type="submit" class="btn primary">Save link</button>
      </form>
    </header>

    <section class="view">
      <div id="viewHead" class="view-head"></div>
      <div id="list" class="list"></div>
    </section>

    <section id="reader" class="reader" hidden>
      <header class="reader-bar">
        <button id="readerClose" class="btn ghost icon" title="Back to library (Esc)" aria-label="Back to library">←</button>
        <div class="reader-title">
          <b id="readerTitle"></b>
          <small id="readerMeta"></small>
        </div>
        <div class="reader-actions">
          <button id="readerNotes" class="btn small ghost" title="Highlights and notes" hidden>✎ Notes</button>
          <a id="readerOpen" class="btn small ghost" target="_blank" rel="noopener" title="The article as one continuous PDF page">PDF</a>
          <a id="readerOriginal" class="btn small ghost" target="_blank" rel="noopener noreferrer" title="Open on Medium">Medium ↗</a>
          <button id="readerRefetch" class="btn small ghost" title="Download a fresh copy" aria-label="Download a fresh copy">⟳</button>
        </div>
        <div class="read-progress"><span id="readProgress"></span></div>
      </header>
      <div id="readerBody" class="reader-body"></div>
    </section>
  </main>
</div>

<dialog id="dlg" class="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<div id="selTools" class="sel-tools" role="toolbar" aria-label="Selected text" hidden>
  <button class="swatch hl-yellow" data-hl="yellow" title="Highlight (H)" aria-label="Highlight yellow"></button>
  <button class="swatch hl-green" data-hl="green" title="Highlight green" aria-label="Highlight green"></button>
  <button class="swatch hl-blue" data-hl="blue" title="Highlight blue" aria-label="Highlight blue"></button>
  <button class="swatch hl-pink" data-hl="pink" title="Highlight pink" aria-label="Highlight pink"></button>
  <span class="sep"></span>
  <button data-act="note" title="Highlight and add a note (N)">✎ Note</button>
  <button data-act="summarize" title="Summarize in ChatGPT (S)">✦ Summarize</button>
  <button data-act="copy" title="Copy the selected text">Copy</button>
</div>
<div id="hlPop" class="hl-pop" hidden></div>
<!-- KaTeX (~272 KB) and highlight.js (~129 KB) are only needed inside the reader, so they are
     loaded on demand by app.js when an article is first opened, not on every homepage visit. -->
<script defer src="/static/article.js"></script>
<script defer src="/static/app.js"></script>
<script defer src="/static/briefing.js"></script>
<script type="module" src="/static/babel.js"></script>
</body>
</html>
